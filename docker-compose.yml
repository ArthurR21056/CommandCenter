services:

  # ── Legacy Express/SQLite backend ──────────────────────────────────────────
  # Handles skills, todos, and user identity.
  # For the new API (auth/login, tasks, calendar, email), set API_HOST below
  # to point to your external backend instead.
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_PATH: /app/data/commandcenter.db
    volumes:
      - sqlite-data:/app/data

  # ── React dashboard (nginx) ────────────────────────────────────────────────
  frontend:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Change this to your new API URL if using the external backend on port 3000:
      #   API_HOST: http://host.docker.internal:3000
      API_HOST: http://server:3001
    depends_on:
      - server

volumes:
  sqlite-data:
