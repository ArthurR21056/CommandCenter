services:

  # ── React dashboard (nginx) ────────────────────────────────────────────────
  frontend:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      API_HOST: http://host.docker.internal:3000
      # Tells nginx envsubst to only replace ${API_HOST}, leaving nginx
      # variables like $uri and $host untouched in the template.
      NGINX_ENVSUBST_FILTER: API_HOST
    extra_hosts:
      - "host.docker.internal:host-gateway"
